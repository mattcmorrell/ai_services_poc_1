<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Selection UX — Decision Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding: 40px 48px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  .last-updated {
    font-size: 11px;
    color: #52525b;
  }
  .subtitle { font-size: 13px; color: #71717a; margin-bottom: 28px; }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #a1a1aa;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid #1e1e26;
    background: #111116;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .stat:hover {
    border-color: #3a3a48;
    background: #1a1a22;
  }
  .stat.active {
    border-color: var(--stat-color);
    background: var(--stat-bg);
  }
  .stat .count {
    font-weight: 700;
    font-size: 13px;
    color: #e4e4e7;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .stat .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Filter hint */
  .filter-hint {
    font-size: 11px;
    color: #3f3f46;
    margin-bottom: 32px;
    height: 16px;
    transition: color 0.15s;
  }
  .filter-hint.visible {
    color: #a1a1aa;
  }

  /* Active-only toggle */
  .toggle-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: -20px;
    margin-bottom: 28px;
  }
  .toggle {
    position: relative;
    width: 34px;
    height: 18px;
    border-radius: 9px;
    background: #2a2a35;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
    padding: 0;
  }
  .toggle.on {
    background: #3b82f6;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #e4e4e7;
    transition: transform 0.2s;
  }
  .toggle.on::after {
    transform: translateX(16px);
  }
  .toggle-label {
    font-size: 12px;
    color: #71717a;
    cursor: pointer;
    user-select: none;
  }

  /* Section groups */
  .section {
    margin-bottom: 32px;
  }
  .section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #71717a;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* Card grid — flat list, no tree lines */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card-item {
    transition: opacity 0.2s;
  }
  .card-item.dimmed {
    opacity: 0.15;
  }

  /* Child indent */
  .card-item.child {
    padding-left: 32px;
    position: relative;
  }
  .card-item.child::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #1e1e26;
    border-radius: 1px;
  }
  .card-item.child::after {
    content: '';
    position: absolute;
    left: 14px;
    top: 50%;
    width: 10px;
    height: 2px;
    background: #1e1e26;
  }

  .spawn-tag {
    font-size: 10px;
    color: #8b5cf6;
    padding-left: 34px;
    margin-top: -2px;
    margin-bottom: 2px;
    font-style: italic;
  }

  /* Card */
  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #2a2a35;
    background: #141419;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    cursor: default;
  }
  .card:hover {
    border-color: #3a3a48;
    background: #1a1a22;
  }

  /* Status-specific card styling */
  .card.status-exploring {
    border-color: #3b82f633;
    background: rgba(59, 130, 246, 0.06);
  }
  .card.status-new {
    border-color: #8b5cf633;
    background: rgba(139, 92, 246, 0.06);
  }
  .card.status-filed {
    border-color: #f59e0b22;
    background: rgba(245, 158, 11, 0.03);
  }
  .card.status-parked {
    opacity: 0.75;
  }
  .card.status-abandoned {
    opacity: 0.6;
  }

  /* Status dot */
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.exploring { background: #3b82f6; box-shadow: 0 0 6px rgba(59,130,246,0.5); }
  .status-dot.new       { background: #8b5cf6; box-shadow: 0 0 6px rgba(139,92,246,0.5); }
  .status-dot.filed     { background: #f59e0b; }
  .status-dot.parked    { background: #52525b; }
  .status-dot.abandoned { background: #3f3f46; }

  /* Card content */
  .card-id {
    font-size: 10px; font-weight: 700; color: #71717a;
    background: #1a1a22; padding: 1px 5px; border-radius: 3px;
    flex-shrink: 0; font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .card-name {
    font-size: 13px; font-weight: 600; color: #f4f4f5; white-space: nowrap;
  }
  .card-version {
    font-size: 10px; color: #71717a; flex-shrink: 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .card-status {
    font-size: 10px; font-weight: 500; padding: 2px 7px;
    border-radius: 10px; flex-shrink: 0;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .card-status.exploring { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .card-status.new       { background: rgba(139,92,246,0.15); color: #c4b5fd; }
  .card-status.filed     { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .card-status.parked    { background: rgba(82,82,91,0.25); color: #71717a; }
  .card-status.abandoned { background: rgba(63,63,70,0.2); color: #52525b; }

  .card-note {
    font-size: 11px; color: #a1a1aa; margin-left: auto;
    text-align: right; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    max-width: 400px;
  }

  /* Links — inline with note, very subtle */
  .card-links {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .card-link {
    font-size: 10px;
    color: #a1a1aa;
    text-decoration: none;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #2a2a35;
    background: #1a1a22;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .card-link:hover {
    color: #e4e4e7;
    border-color: #52525b;
    background: #22222a;
  }
  .card-link .link-icon {
    font-size: 10px;
  }

  /* Editable fields */
  .card-name[data-editable],
  .card-note[data-editable] {
    cursor: text;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s, background 0.15s;
    border-radius: 2px;
    padding: 0 2px;
    margin: 0 -2px;
  }
  .card-name[data-editable]:hover,
  .card-note[data-editable]:hover {
    border-bottom-color: #3f3f46;
  }
  .card-name[data-editable]:focus,
  .card-note[data-editable]:focus {
    outline: none;
    border-bottom-color: #3b82f6;
    background: rgba(59, 130, 246, 0.08);
    white-space: normal;
    max-width: none;
    overflow: visible;
  }
  .card-status[data-editable] {
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .card-status[data-editable]:hover {
    transform: scale(1.08);
    box-shadow: 0 0 8px rgba(255,255,255,0.08);
  }

  /* Save indicator */
  .save-indicator {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #2a2a35;
    background: #141419;
    font-size: 12px;
    color: #a1a1aa;
    transition: transform 0.25s ease, opacity 0.25s ease;
    opacity: 0;
    z-index: 100;
    pointer-events: none;
  }
  .save-indicator.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .save-indicator.success {
    border-color: #22c55e44;
    color: #4ade80;
  }
  .save-indicator.error {
    border-color: #ef444444;
    color: #f87171;
  }

  /* Keyboard hints */
  .kbd-hints {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: #3f3f46;
  }
  .kbd {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .kbd code {
    background: #1e1e26;
    border: 1px solid #1e1e26;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    color: #52525b;
  }

  @media (max-width: 700px) {
    body { padding: 20px; }
    .card-note { display: none; }
    .card-links { display: none; }
    .kbd-hints { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title"></h1>
  <span class="last-updated" id="lastUpdated"></span>
</div>
<p class="subtitle" id="subtitle"></p>

<div class="stats-bar" id="statsBar"></div>
<div class="filter-hint" id="filterHint">Click a status to filter</div>

<div class="toggle-bar">
  <button class="toggle" id="activeToggle" onclick="toggleActiveOnly()"></button>
  <span class="toggle-label" onclick="toggleActiveOnly()">Show active only</span>
</div>

<div id="tree"></div>

<div class="save-indicator" id="saveIndicator"></div>

<div class="kbd-hints">
  <span class="kbd"><code>Esc</code> clear filter</span>
  <span class="kbd"><code>Dbl-click</code> edit</span>
  <span class="kbd"><code>Click status</code> cycle</span>
</div>

<script>
// ── State ──
let DATA = null;
let ORIGINAL_DATA = null;
let activeFilter = null;
let saveTimeout = null;
let activeOnly = false;
const ACTIVE_STATUSES = ['exploring', 'new', 'filed'];

async function loadData() {
  try {
    const resp = await fetch('decision-tree-data.json');
    DATA = await resp.json();
  } catch (e) {
    console.warn('Could not fetch JSON');
  }
  if (!DATA) {
    document.getElementById('tree').innerHTML = '<p style="color:#f87171">Could not load decision-tree-data.json</p>';
    return;
  }
  ORIGINAL_DATA = JSON.parse(JSON.stringify(DATA));
  render();
}

// ── Auto-save ──
function findNode(nodes, id) {
  for (const node of nodes) {
    if (node.phase && node.children) {
      const found = findNode(node.children, id);
      if (found) return found;
      continue;
    }
    if (node.id === id) return node;
    if (node.children) {
      const found = findNode(node.children, id);
      if (found) return found;
    }
  }
  return null;
}

function scheduleSave() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveToFile, 300);
}

async function saveToFile() {
  DATA.lastUpdated = new Date().toISOString().slice(0, 10);
  try {
    const resp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DATA, null, 2),
    });
    if (!resp.ok) throw new Error('Save failed');
    showSaveIndicator('Saved', 'success');
  } catch (e) {
    showSaveIndicator('Save failed', 'error');
  }
}

function showSaveIndicator(text, type) {
  const el = document.getElementById('saveIndicator');
  el.textContent = (type === 'success' ? '✓ ' : '✗ ') + text;
  el.className = 'save-indicator visible ' + type;
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => {
    el.className = 'save-indicator';
  }, 1200);
}

// ── Status cycling ──
const STATUS_ORDER = ['exploring', 'new', 'filed', 'parked', 'abandoned'];

function cycleStatus(nodeId) {
  const node = findNode(DATA.tree, nodeId);
  if (!node) return;
  const idx = STATUS_ORDER.indexOf(node.status);
  node.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
  scheduleSave();
  render();
}

// ── Stats ──
function collectStatuses(nodes, counts) {
  for (const node of nodes) {
    if (node.phase && node.children) { collectStatuses(node.children, counts); continue; }
    if (node.status && node.status !== 'root') counts[node.status] = (counts[node.status] || 0) + 1;
    if (node.children) collectStatuses(node.children, counts);
  }
  return counts;
}

function renderStats() {
  const counts = collectStatuses(DATA.tree, {});
  const bar = document.getElementById('statsBar');
  bar.innerHTML = '';
  const order = ['exploring', 'new', 'filed', 'parked', 'abandoned'];
  let total = 0;
  for (const key of order) {
    const count = counts[key] || 0;
    total += count;
    const cfg = DATA.statuses[key];
    const isActive = activeFilter === key;
    const stat = document.createElement('div');
    stat.className = 'stat' + (isActive ? ' active' : '');
    stat.style.setProperty('--stat-color', cfg.color);
    stat.style.setProperty('--stat-bg', cfg.color + '15');
    stat.innerHTML = `<div class="dot" style="background:${cfg.color};${cfg.glow ? 'box-shadow:0 0 6px ' + cfg.color + '66' : ''}"></div><span class="count">${count}</span><span>${cfg.label}</span>`;
    stat.addEventListener('click', () => toggleFilter(key));
    bar.appendChild(stat);
  }
  const totalStat = document.createElement('div');
  totalStat.className = 'stat';
  totalStat.style.cursor = 'default';
  totalStat.innerHTML = `<span class="count">${total}</span><span>Total</span>`;
  bar.appendChild(totalStat);
}

function toggleFilter(status) {
  activeFilter = activeFilter === status ? null : status;
  renderStats();
  applyFilter();
  updateFilterHint();
}

function updateFilterHint() {
  const hint = document.getElementById('filterHint');
  if (activeFilter) {
    hint.textContent = `Showing: ${DATA.statuses[activeFilter].label} · Click again or Esc to clear`;
    hint.className = 'filter-hint visible';
  } else {
    hint.textContent = 'Click a status to filter';
    hint.className = 'filter-hint';
  }
}

function toggleActiveOnly() {
  activeOnly = !activeOnly;
  document.getElementById('activeToggle').classList.toggle('on', activeOnly);
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.card-item[data-status]').forEach(el => {
    const status = el.dataset.status;
    const isActive = ACTIVE_STATUSES.includes(status);
    // Also hide spawn tags for hidden children
    const spawnTag = el.previousElementSibling;
    const hasSpawnTag = spawnTag && spawnTag.classList.contains('spawn-tag');

    let hidden = false;
    let dimmed = false;

    if (activeOnly && !isActive) {
      hidden = true;
    }
    if (activeFilter && status !== activeFilter) {
      dimmed = true;
    }

    el.style.display = hidden ? 'none' : '';
    el.classList.toggle('dimmed', dimmed);
    if (hasSpawnTag) spawnTag.style.display = hidden ? 'none' : '';
  });
}

// ── Rendering ──
function renderVersion(node) {
  if (!node.versions) return '';
  return node.currentVersion || node.versions[node.versions.length - 1];
}

function renderLinks(node) {
  let html = '';
  if (node.mockup) html += `<a class="card-link" href="${node.mockup}" target="_blank"><span class="link-icon">◻</span>Mockup</a>`;
  if (node.prototype) html += `<a class="card-link" href="http://${node.prototype}" target="_blank"><span class="link-icon">▶</span>Proto</a>`;
  if (!html) return '';
  return `<div class="card-links">${html}</div>`;
}

function renderCardHTML(node, isChild) {
  const s = node.status;
  const statusLabel = DATA.statuses[s]?.label || s;
  const ver = renderVersion(node);

  let html = '';

  if (node.spawn && isChild) {
    html += `<div class="spawn-tag">↳ ${node.spawn}</div>`;
  }

  html += `<div class="card-item${isChild ? ' child' : ''}" data-status="${s}" data-id="${node.id}">`;
  html += `<div class="card status-${s}">`;
  html += `<div class="status-dot ${s}"></div>`;
  html += `<span class="card-id">${node.id}</span>`;
  html += `<span class="card-name" data-editable data-node-id="${node.id}" data-field="name" contenteditable="false">${node.name}</span>`;
  if (ver) html += `<span class="card-version">${ver}</span>`;
  html += `<span class="card-status ${s}" data-editable data-node-id="${node.id}" title="Click to cycle">${statusLabel}</span>`;
  html += `<span class="card-note" data-editable data-node-id="${node.id}" data-field="note" contenteditable="false">${node.note || ''}</span>`;
  html += renderLinks(node);
  html += `</div></div>`;

  // Render children
  if (node.children) {
    for (const child of node.children) {
      html += renderCardHTML(child, true);
    }
  }

  return html;
}

function renderTree() {
  const container = document.getElementById('tree');
  let html = '';

  // Walk the tree: skip root, render phases as sections
  const root = DATA.tree[0];
  if (!root || !root.children) return;

  for (const group of root.children) {
    if (group.phase) {
      html += `<div class="section">`;
      html += `<div class="section-label">${group.phase}</div>`;
      html += `<div class="card-list">`;
      for (const node of group.children) {
        html += renderCardHTML(node, false);
      }
      html += `</div></div>`;
    }
  }

  container.innerHTML = html;
}

function render() {
  document.getElementById('title').textContent = DATA.title;
  document.getElementById('subtitle').textContent = DATA.subtitle;
  document.getElementById('lastUpdated').textContent = `Updated ${DATA.lastUpdated}`;
  renderStats();
  renderTree();
  updateFilterHint();
  bindEditables();
}

// ── Inline editing ──
function bindEditables() {
  document.querySelectorAll('[data-editable][data-field]').forEach(el => {
    el.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      el.contentEditable = 'true';
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    el.addEventListener('blur', () => {
      el.contentEditable = 'false';
      const nodeId = el.dataset.nodeId;
      const field = el.dataset.field;
      const value = el.textContent.trim();
      const node = findNode(DATA.tree, nodeId);
      if (node && node[field] !== value) {
        node[field] = value;
        scheduleSave();
      }
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') {
        e.stopPropagation();
        const node = findNode(DATA.tree, el.dataset.nodeId);
        if (node) el.textContent = node[el.dataset.field] || '';
        el.contentEditable = 'false';
      }
    });
  });

  document.querySelectorAll('.card-status[data-editable]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      cycleStatus(el.dataset.nodeId);
    });
  });
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  if (e.target.contentEditable === 'true') return;
  if (e.key === 'Escape') {
    activeFilter = null;
    renderStats();
    applyFilter();
    updateFilterHint();
  }
});

// ── Init ──
loadData();
</script>

</body>
</html>
